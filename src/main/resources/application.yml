spring:
  application:
    name: crypto-trading-bot

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      # Redis 캐시 설정
      cache:
        type: redis
        redis:
          time-to-live: 10m  # 기본 TTL: 10분

  cache:
    type: redis
    redis:
      time-to-live: 10m

trading:
  scheduler:
    enabled: true        # false로 바꾸면 전략 스케줄러 중지

  execution:
    enabled: false       # true: 실제 업비트 주문 제출 / false(기본): 신호·로그만, 주문 없음

  ai:
    base-url: http://localhost:8000   # Python ML 서버 주소
    timeout-ms: 800                   # ML 서버 응답 타임아웃 (ms)
    mode: RULE_ONLY                   # RULE_ONLY: ML 없이 기존 동작 / SHADOW: ML 로그만 / ENSEMBLE: ML 필터 적용
    buy-threshold: 0.6                # ENSEMBLE 모드 매수 최소 확률

  scanner:
    min-trade-price-24h: 20000000000  # 최소 24h 거래대금 (200억 KRW — 저유동성 알트 제외)
    max-coins: 30                     # 스캔 결과 최대 코인 수
    min-change-rate: 0.005            # 최소 24h 변동률 (+0.5%, 하락/보합 코인 제외)
    max-change-rate: 0.07             # 최대 24h 변동률 (+7%, 과매수 제외)

  market-filter:
    enabled: true                     # false이면 시장 컨텍스트 진입 필터 비활성화
    block-when-market-downtrend: true # BTC TRENDING_DOWN 시 알트 롱 차단
    market-symbol: KRW-BTC            # 시장 지수 심볼 (코인=KRW-BTC, 주식=지수로 교체 가능)

  mtf:
    enabled: true                     # false이면 다중 타임프레임 필터 비활성화
    use-1h-filter: true               # 1시간봉 EMA12 > EMA26 필터 (15m 진입용)
    use-4h-filter: false              # 4시간봉 EMA12 > EMA26 필터 (더 보수적)

  risk:
    stop-loss-percent: 5.0            # 손절 비율 (%) — 퍼센트 기반 폴백용
    take-profit-percent: 10.0          # 목표 수익 비율 (%) — 퍼센트 기반 폴백용
    max-daily-loss: 10.0              # 일일 최대 손실 한도 (%)
    risk-per-trade: 0.10              # 1회 기본 투자 비율 (총자산의 10%)
    max-order-percent: 0.15           # 1회 최대 투자 비율 (총자산의 15%, STRONG_BUY 시)
    min-order-amount: 20000           # 최소 주문 금액 (KRW)
    max-open-positions: 3             # 최대 동시 보유 코인 수
    # ATR 기반 리스크 파라미터 (라이브·백테스트 공통)
    stop-atr-mult: 3.0               # 손절 = 진입가 − stop-atr-mult × ATR
    partial-exit-r: 1.0              # 1차 부분청산 트리거: +1R 달성 시 원포지션 50% 청산
    partial-exit-ratio: 0.5          # 1차 부분청산 비율 (0.5 = 50% 청산)
    partial2-r: 2.0                  # 2차 부분청산 트리거: +2R 달성 시 남은 포지션 50% 청산 (원포지션 25%)
    partial2-ratio: 0.5              # 2차 부분청산 비율 (0.5 = 남은 것의 50%)
    trail-atr-mult: 3.0              # 기본 챈들리어 트레일링 = 최고가 − 3×ATR
    trail-atr-mult-after-p2: 1.5     # +2R 도달 후 강화 트레일링 = 최고가 − 1.5×ATR
    take-profit-r: 3.0               # 하드 익절 상한 = stop-atr-mult × take-profit-r × ATR (0이면 미사용)

backtest:
  fee-rate: 0.0005        # 편도 수수료 (업비트 KRW 마켓 0.05%)
  slippage-rate: 0.0003   # 편도 슬리피지 (보수적 추정 0.03%)

upbit:
  api:
    base-url: https://api.upbit.com
    timeout-ms: 10000
    access-key: ${UPBIT_ACCESS_KEY}
    secret-key: ${UPBIT_SECRET_KEY}

# 뉴스·공시 API 설정
dart:
  api-key: ${DART_API_KEY:}             # DART Open API 키 (opendart.fss.or.kr)

bigkinds:
  api-key: ${BIGKINDS_API_KEY:}         # 빅카인즈 API 키 (bigkinds.or.kr)

naver:
  client-id: ${NAVER_CLIENT_ID:}        # 네이버 검색 API Client ID
  client-secret: ${NAVER_CLIENT_SECRET:} # 네이버 검색 API Client Secret

# AI 기업 리포트 설정 (기능4)
gemini:
  api-key: ${GEMINI_API_KEY:}           # Google Gemini API 키 (aistudio.google.com/app/apikey)
  model: gemini-1.5-flash               # 무료 티어 사용 가능 모델

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
  packages-to-scan: com.example.cryptobot

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.example.cryptobot: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
        probes:
            enabled: true
